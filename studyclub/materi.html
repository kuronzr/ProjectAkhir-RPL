<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materi - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="home.html" class="logo"><img src="img/logo.png" alt="Study Club"></a>

      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="home.html">Home</a></li>
          <li><a href="course.html">Course</a></li>
          <li><a href="schedule-anggota.html">Schedule</a></li>
          <li><a href="announcement.html">Announcement</a></li>
          <li><a href="testimony.html">Testimony</a></li>
        </ul>
      </nav>

      <div class="actions">
        <a href="premium.html" class="btn-premium">Premium</a>
        <button class="icon-btn" aria-label="Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <a href="profil.html" class="avatar" aria-label="Profil"></a>
      </div>
    </div>
  </header>

  <main class="container m-page">
    <a class="m-back" id="kembali" href="course.html">&larr; Kembali</a>

    <!-- ===== JUDUL ===== -->
    <div class="m-head">
      <span class="m-ava"></span>
      <div>
        <h1 class="m-title" id="judul">Materi</h1>
        <div class="m-date" id="tanggal"></div>
      </div>
    </div>

    <p class="m-empty" id="kosong" hidden></p>

    <div id="isi" hidden>
      <!-- ===== VIDEO (dummy) ===== -->
      <div class="m-video">
        <video id="video" controls preload="metadata" playsinline></video>
      </div>

      <div class="m-center">
        <a class="m-unduh" id="unduh" href="#" download>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
          Unduh
        </a>
      </div>

      <!-- ===== TAB ===== -->
      <div class="m-tabs" role="group" aria-label="Isi materi">
        <button type="button" class="m-tab active" data-tab="deskripsi" aria-pressed="true">Deskripsi</button>
        <button type="button" class="m-tab" data-tab="modul" aria-pressed="false">Modul</button>
      </div>

      <section class="m-panel" id="panel-deskripsi">
        <p id="deskripsi"></p>
      </section>

      <section class="m-panel m-panel-modul" id="panel-modul" hidden>
        <ul class="m-modul" id="modul"></ul>
      </section>
    </div>
  </main>

  <script src="js/kursus-data.js"></script>
  <script src="js/materi.js"></script>
  <script src="js/notif.js"></script>
</body>
</html>
