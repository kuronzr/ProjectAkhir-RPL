<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadwal Kegiatan - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="schedule.css">
  <link rel="stylesheet" href="anggota.css">
  <link rel="stylesheet" href="notif.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="home.html" class="logo"><img src="img/logo.png" alt="Study Club"></a>

      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="home.html">Home</a></li>
          <li><a href="course.html">Course</a></li>
          <li><a href="schedule.html">Schedule</a></li>
          <li><a href="announcement.html">Announcement</a></li>
          <li><a href="testimony.html">Testimony</a></li>
        </ul>
      </nav>

      <div class="actions">
        <a href="premium.html" class="btn-premium">Premium</a>
        <button class="icon-btn" aria-label="Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <a href="profil.html" class="avatar" aria-label="Profil"></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Jadwal Kegiatan</h1>
    <p class="page-sub">Daftar kegiatan Study Club. Halaman ini hanya untuk dilihat.</p>

    <div class="toolbar">
      <div>
        <label for="filter">Kategori</label>
        <select id="filter">
          <option value="">Semua</option>
          <option value="Praktikum">Praktikum</option>
          <option value="Materi">Materi</option>
          <option value="Diskusi">Diskusi</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <span class="count" id="jumlah" aria-live="polite"></span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Kegiatan</th>
            <th>Kategori</th>
            <th>Tanggal</th>
            <th>Waktu</th>
            <th>Lokasi</th>
            <th>Deskripsi</th>
          </tr>
        </thead>
        <tbody id="daftar"></tbody>
      </table>
    </div>
  </main>

  <script src="anggota.js"></script>
  <script src="notif.js"></script>
</body>
</html>
