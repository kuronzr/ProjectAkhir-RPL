<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Admin - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="home-admin.html" class="logo"><img src="img/logo.png" alt="Study Club"></a>
      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="home-admin.html">Home</a></li>
          <li><a href="course-admin.html">Course</a></li>
          <li><a href="schedule-admin.html">Schedule</a></li>
          <li><a href="announcement.html">Announcement</a></li>
          <li><a href="testimony.html">Testimony</a></li>
          <li><a href="pengajuan-subscription.html">Pengajuan</a></li>
          <li><a href="anggota-subscription.html" class="current" aria-current="page">Subscription</a></li>
        </ul>
      </nav>
      <div class="actions">
        <span class="role">Admin</span>
        <a href="profil.html" class="avatar" aria-label="Profil admin"></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Course <span class="c-admin-badge">Admin</span></h1>

    <div class="c-toolbar">
      <select id="urut" aria-label="Urutkan course">
        <option value="nama">Urut berdasarkan nama kursus</option>
      </select>

      <label class="search" for="cari">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
        <input type="search" id="cari" placeholder="Cari">
      </label>

      <div class="views" role="group" aria-label="Tampilan">
        <button type="button" class="view-btn active" data-view="grid" aria-label="Tampilan kartu" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="2" />
            <rect x="14" y="3" width="7" height="7" rx="2" />
            <rect x="3" y="14" width="7" height="7" rx="2" />
            <rect x="14" y="14" width="7" height="7" rx="2" />
          </svg>
        </button>
        <button type="button" class="view-btn" data-view="list" aria-label="Tampilan daftar" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M9 6h12M9 12h12M9 18h12" />
            <circle cx="4.5" cy="6" r="1" />
            <circle cx="4.5" cy="12" r="1" />
            <circle cx="4.5" cy="18" r="1" />
          </svg>
        </button>
      </div>
    </div>

    <section id="courses" class="courses grid" aria-live="polite"></section>
  </main>

  <script src="js/kursus-data.js"></script>
  <script src="js/praktikum-data.js"></script>
  <script src="js/store-admin.js"></script>
  <script src="js/course-admin.js"></script>
  <script src="js/notif.js"></script>
</body>

</html>
