<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengajuan Subscription - Admin Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studyclub/public/CSS/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="/studyclub/public/view/home-admin.html" class="logo"><img src="/studyclub/public/img/logo.png" alt="Study Club"></a>
      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="/studyclub/public/view/home-admin.html">Home</a></li>
          <li><a href="/studyclub/public/view/course-admin.html">Course</a></li>
          <li><a href="/studyclub/public/view/schedule-admin.html">Schedule</a></li>
          <li><a href="/studyclub/public/view/announcement.html">Announcement</a></li>
          <li><a href="/studyclub/public/view/testimony.html">Testimony</a></li>
          <li><a href="/studyclub/public/view/pengajuan-subscription.html">Pengajuan</a></li>
          <li><a href="/studyclub/public/view/anggota-subscription.html" class="current" aria-current="page">Subscription</a></li>
        </ul>
      </nav>

      <div class="actions">
        <span class="role">Admin</span>
        <a href="/studyclub/public/view/profil.html" class="avatar" aria-label="Profil admin"></a>
      </div>
    </div>
  </header>

  <main class="container page">
    <h1>Pengajuan Subscription</h1>
    <p class="sub">Tinjau pengajuan subscription study club yang masuk, lalu terima atau tolak.</p>

    <!-- ===== FILTER ===== -->
    <div class="toolbar">
      <div class="filter">
        <label for="filter">Status</label>
        <select id="filter">
          <option value="menunggu">Menunggu</option>
          <option value="diterima">Diterima</option>
          <option value="ditolak">Ditolak</option>
          <option value="semua">Semua</option>
        </select>
      </div>
      <span class="count" id="count">0 pengajuan</span>
    </div>

    <!-- ===== TABEL ===== -->
    <div class="table-box">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Nomor</th>
              <th>Nama</th>
              <th>Jenis Subs</th>
              <th>Metode Pembayaran</th>
              <th>Tanggal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/pengajuan-subscription.js"></script>
</body>
</html>
