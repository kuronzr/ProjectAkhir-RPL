<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Admin - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studyclub/public/CSS/style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="/studyclub/public/view/home-admin.html" class="logo"><img src="/studyclub/public/img/logo.png" alt="Study Club"></a>
      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="/studyclub/public/view/home-admin.html">Home</a></li>
          <li><a href="/studyclub/public/view/course-admin.html">Course</a></li>
          <li><a href="/studyclub/public/view/schedule-admin.html">Schedule</a></li>
          <li><a href="/studyclub/public/view/announcement.html">Announcement</a></li>
          <li><a href="/studyclub/public/view/testimony.html">Testimony</a></li>
          <li><a href="/studyclub/public/view/pengajuan-subscription.html">Pengajuan</a></li>
          <li><a href="/studyclub/public/view/anggota-subscription.html" class="current" aria-current="page">Subscription</a></li>
        </ul>
      </nav>
      <div class="actions">
        <span class="role">Admin</span>
        <a href="/studyclub/public/view/profil.html" class="avatar" aria-label="Profil admin"></a>
      </div>
    </div>
  </header>

  <main class="container m-page">
    <a class="m-back" id="kembali" href="/studyclub/public/view/course-admin.html">&larr; Kembali</a>
    <p class="m-empty" id="kosong" hidden></p>

    <form class="a-card" id="form" novalidate hidden>
      <h1 class="a-judul" id="judul-form"></h1>

      <label class="a-label" for="nama" id="lbl-nama">Nama Materi</label>
      <input class="a-input" type="text" id="nama" maxlength="120" required>

      <label class="a-label" for="desk" id="lbl-desk">Deskripsi</label>
      <textarea class="a-input" id="desk" rows="3"></textarea>

      <div class="only-praktikum" hidden>
        <label class="a-label" for="tgl">Tenggat</label>
        <input class="a-input" type="date" id="tgl">
      </div>

      <div class="only-materi">
        <span class="a-label">Modul</span>
        <input type="file" id="modul-input" accept=".pdf" multiple hidden>
        <div class="a-row">
          <div class="a-chips" id="modul"></div>
          <button type="button" class="a-addbox" id="modul-add" aria-label="Tambah modul" hidden>+</button>
        </div>
        <button type="button" class="a-drop" id="modul-drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M12 16v-5" />
            <path d="M9.5 13l2.5-2.5 2.5 2.5" />
          </svg>
          <span class="a-drop-title">Pilih file di sini</span>
          <span class="a-drop-info">pdf, maks 10MB</span>
        </button>

        <span class="a-label">Video</span>
        <input type="file" id="video-input" accept="video/*" hidden>
        <button type="button" class="a-drop" id="video-drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M12 16v-5" />
            <path d="M9.5 13l2.5-2.5 2.5 2.5" />
          </svg>
          <span class="a-drop-title" id="video-title">Pilih file di sini</span>
          <span class="a-drop-info" id="video-info">Video maks 4MB</span>
        </button>
      </div>

      <p class="p-status" id="status" role="status" aria-live="polite"></p>
      <div class="a-actions">
        <button type="submit" class="a-btn a-simpan">Unggah</button>
        <button type="button" class="a-btn a-hapus" id="hapus" hidden>Hapus</button>
      </div>
    </form>
  </main>

  <script src="js/kursus-data.js"></script>
  <script src="js/praktikum-data.js"></script>
  <script src="js/store-admin.js"></script>
  <script src="js/form-admin.js"></script>
  <script src="js/notif.js"></script>
</body>

</html>
