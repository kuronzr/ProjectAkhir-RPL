<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kursus Admin - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studyclub/public/CSS/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="/studyclub/public/view/home-admin.html" class="logo"><img src="/studyclub/public/img/logo.png" alt="Study Club"></a>
      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="/studyclub/public/view/home-admin.html">Home</a></li>
          <li><a href="/studyclub/public/view/course-admin.html">Course</a></li>
          <li><a href="/studyclub/public/view/schedule-admin.html">Schedule</a></li>
          <li><a href="/studyclub/public/view/announcement.html">Announcement</a></li>
          <li><a href="/studyclub/public/view/testimony.html">Testimony</a></li>
          <li><a href="/studyclub/public/view/pengajuan-subscription.html">Pengajuan</a></li>
          <li><a href="/studyclub/public/view/anggota-subscription.html" class="current" aria-current="page">Subscription</a></li>
        </ul>
      </nav>
      <div class="actions">
        <span class="role">Admin</span>
        <a href="/studyclub/public/view/profil.html" class="avatar" aria-label="Profil admin"></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="k-banner" aria-label="Banner kursus">
      <div class="k-cover p-navy" id="cover"><span class="k-tag" id="tag"></span></div>
    </section>

    <a class="k-back" href="/studyclub/public/view/course-admin.html">&larr; Kembali ke Course</a>
    <h1 class="k-title" id="judul">Kursus</h1>

    <div class="k-tabs" role="group" aria-label="Jenis kegiatan">
      <button type="button" class="k-tab active" data-tab="praktikum" aria-pressed="true">Praktikum</button>
      <button type="button" class="k-tab" data-tab="materi" aria-pressed="false">Materi</button>
      <a class="a-plus" id="tambah" href="/studyclub/public/view/kursus-form.html" aria-label="Tambah">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </div>

    <ul class="k-list" id="daftar" aria-live="polite"></ul>
  </main>

  <script src="js/kursus-data.js"></script>
  <script src="js/praktikum-data.js"></script>
  <script src="js/store-admin.js"></script>
  <script src="js/kursus-admin.js"></script>
  <script src="js/notif.js"></script>
</body>
</html>
