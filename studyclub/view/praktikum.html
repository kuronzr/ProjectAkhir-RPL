<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studyclub/public/CSS/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="/studyclub/public/view/home.html" class="logo"><img src="/studyclub/public/img/logo.png" alt="Study Club"></a>

      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="/studyclub/public/view/home.html">Home</a></li>
          <li><a href="/studyclub/public/view/course.html">Course</a></li>
          <li><a href="/studyclub/public/view/schedule-anggota.html">Schedule</a></li>
          <li><a href="/studyclub/public/view/announcement.html">Announcement</a></li>
          <li><a href="/studyclub/public/view/testimony.html">Testimony</a></li>
        </ul>
      </nav>

      <div class="actions">
        <a href="/studyclub/public/view/premium.html" class="btn-premium">Premium</a>
        <button class="icon-btn" aria-label="Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <a href="/studyclub/public/view/profil.html" class="avatar" aria-label="Profil"></a>
      </div>
    </div>
  </header>

  <main class="container m-page">
    <a class="m-back" id="kembali" href="/studyclub/public/view/course.html">&larr; Kembali</a>

    <!-- ===== JUDUL ===== -->
    <div class="m-head">
      <span class="m-ava"></span>
      <div>
        <h1 class="m-title" id="judul">Praktikum</h1>
        <div class="m-date" id="tanggal"></div>
      </div>
    </div>

    <p class="m-empty" id="kosong" hidden></p>

    <div id="isi" hidden>
      <!-- ===== INSTRUKSI ===== -->
      <section class="p-box">
        <p class="p-instruksi" id="instruksi"></p>
      </section>

      <!-- ===== REFERENSI ===== -->
      <section class="p-box">
        <h2 class="p-sub">Refrensi dan Link GitHub</h2>
        <ul class="m-modul" id="referensi"></ul>
      </section>

      <!-- ===== UNGGAH ===== -->
      <form id="form" novalidate>
        <input type="file" id="berkas" accept=".pdf,.docx" hidden>
        <button type="button" class="p-drop" id="drop" aria-describedby="info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 16v-5"/><path d="M9.5 13l2.5-2.5 2.5 2.5"/></svg>
          <span class="p-drop-title" id="drop-title">Pilih file di sini</span>
          <span class="p-drop-info" id="info">pdf, docx, maks 10MB</span>
        </button>
        <p class="p-status" id="status" role="status" aria-live="polite"></p>
        <button type="submit" class="p-kirim" id="kirim">Unggah Tugas</button>
      </form>
    </div>
  </main>

  <script src="js/kursus-data.js"></script>
  <script src="js/praktikum-data.js"></script>
  <script src="js/praktikum.js"></script>
  <script src="js/notif.js"></script>
</body>
</html>
