<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="schedule.css">
  <link rel="stylesheet" href="notif.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="home-admin.html" class="logo"><img src="img/logo.png" alt="Study Club"></a>
      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="home-admin.html">Home</a></li>
          <li><a href="course-admin.html">Course</a></li>
          <li><a href="schedule-admin.html">Schedule</a></li>
          <li><a href="announcement.html">Announcement</a></li>
          <li><a href="testimony.html">Testimony</a></li>
          <li><a href="pengajuan-subscription.html">Pengajuan</a></li>
          <li><a href="anggota-subscription.html" class="current" aria-current="page">Subscription</a></li>
        </ul>
      </nav>

      <div class="actions">
        <span class="role">Admin</span>
        <a href="profil.html" class="avatar" aria-label="Profil admin"></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Jadwal Kegiatan</h1>
    <p class="page-sub">Tambahkan kegiatan belajar, praktikum, atau pertemuan Study Club.</p>

    <!-- ===== FORM ===== -->
    <section class="panel-box" aria-label="Form jadwal kegiatan">
      <form id="form-jadwal" action="#" method="post">
        <div class="form-grid">
          <div class="full">
            <label for="nama">Nama Kegiatan</label>
            <input type="text" id="nama" name="nama" required>
          </div>

          <div>
            <label for="kategori">Kategori</label>
            <select id="kategori" name="kategori" required>
              <option value="" disabled selected>Pilih kategori</option>
              <option value="Praktikum">Praktikum</option>
              <option value="Materi">Materi</option>
              <option value="Diskusi">Diskusi</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <div>
            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal" name="tanggal" required>
          </div>

          <div>
            <label for="mulai">Waktu Mulai</label>
            <input type="time" id="mulai" name="mulai" required>
          </div>

          <div>
            <label for="selesai">Waktu Selesai</label>
            <input type="time" id="selesai" name="selesai" required>
          </div>

          <div class="full">
            <label for="lokasi">Lokasi / Link Meeting</label>
            <input type="text" id="lokasi" name="lokasi">
          </div>

          <div class="full">
            <label for="deskripsi">Deskripsi</label>
            <textarea id="deskripsi" name="deskripsi"></textarea>
            <p class="error" id="error" role="alert"></p>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Simpan Jadwal</button>
          <button type="reset" class="btn btn-ghost">Reset</button>
        </div>
      </form>
    </section>

    <!-- ===== DAFTAR JADWAL ===== -->
    <h2 class="list-title">Daftar Jadwal</h2>

    <div class="filter-bar">
      <div class="filter">
        <label for="filter-kategori">Kategori</label>
        <select id="filter-kategori">
          <option value="Semua">Semua</option>
          <option value="Praktikum">Praktikum</option>
          <option value="Materi">Materi</option>
          <option value="Diskusi">Diskusi</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <span class="count" id="jumlah" aria-live="polite">0 kegiatan</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Kegiatan</th>
            <th>Kategori</th>
            <th>Tanggal</th>
            <th>Waktu</th>
            <th>Lokasi</th>
            <th>Deskripsi</th>
          </tr>
        </thead>
        <tbody id="daftar"></tbody>
      </table>
    </div>
  </main>

  <script src="schedule.js"></script>
  <script src="notif.js"></script>
</body>
</html>
