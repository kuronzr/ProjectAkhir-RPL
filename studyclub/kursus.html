<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kursus - Study Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="schedule.css">
  <link rel="stylesheet" href="kursus.css">
  <link rel="stylesheet" href="notif.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="bar">
      <a href="home.html" class="logo"><img src="img/logo.png" alt="Study Club"></a>

      <nav aria-label="Menu utama">
        <ul class="nav">
          <li><a href="home.html">Home</a></li>
          <li><a href="course.html">Course</a></li>
          <li><a href="schedule-anggota.html">Schedule</a></li>
          <li><a href="announcement.html">Announcement</a></li>
          <li><a href="testimony.html">Testimony</a></li>
        </ul>
      </nav>

      <div class="actions">
        <a href="premium.html" class="btn-premium">Premium</a>
        <button class="icon-btn" aria-label="Notifikasi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <a href="profil.html" class="avatar" aria-label="Profil"></a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- ===== BANNER ===== -->
    <section class="k-banner" aria-label="Banner kursus">
      <div class="k-cover p-navy" id="cover"><span class="k-tag" id="tag"></span></div>
    </section>

    <a class="k-back" href="course.html">&larr; Kembali ke Course</a>
    <h1 class="k-title" id="judul">Kursus</h1>

    <!-- ===== TAB ===== -->
    <div class="k-tabs" role="group" aria-label="Jenis kegiatan">
      <button type="button" class="k-tab active" data-tab="praktikum" aria-pressed="true">Praktikum</button>
      <button type="button" class="k-tab" data-tab="materi" aria-pressed="false">Materi</button>
    </div>

    <!-- ===== DAFTAR ===== -->
    <ul class="k-list" id="daftar" aria-live="polite"></ul>
  </main>

  <script src="kursus-data.js"></script>
  <script src="kursus.js"></script>
  <script src="notif.js"></script>
</body>
</html>
